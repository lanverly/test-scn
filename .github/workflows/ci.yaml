name: SCN - CI e smoke test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Testes automatizados
        run: python -m pytest -q
      - name: Build da imagem
        run: docker build -t scn-api:${{ github.sha }} .
      - name: Deploy temporario no runner
        run: docker compose up -d --build --wait
      - name: Smoke test HTTP
        run: curl --fail --silent --show-error http://localhost:8000/health
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color
      - name: Encerrar ambiente temporario
        if: always()
        run: docker compose down
